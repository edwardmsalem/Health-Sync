name: Cadence

options:
  bundleIdPrefix: com.salemseats
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Cadence:
    type: application
    # Single multiplatform target: one codebase, two destinations.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salemseats.cadence
        PRODUCT_NAME: Cadence
        INFOPLIST_FILE: Cadence/Resources/Info.plist
        # Entitlements are split per platform: the macOS sandbox keys are
        # invalid on iOS and fail App Store validation there.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Cadence/Resources/Cadence-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Cadence/Resources/Cadence-macOS.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # macOS needs the sandbox on for App Store distribution; the
        # calendars entitlement is what lets EventKit through it.
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      # CloudKit on iOS is gated by the CADENCE_CLOUDKIT compile flag, which
      # must be set ONLY once the iCloud container exists and the iCloud keys
      # are restored in Cadence-iOS.entitlements (see the note in that file).
      # When that day comes, add here:
      #   "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*]": "$(inherited) CADENCE_CLOUDKIT"

  CadenceTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salemseats.cadence.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen writes the iOS-layout TEST_HOST for both platforms, but a
        # macOS bundle keeps its binary under Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Cadence.app/Contents/MacOS/Cadence"

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
        CadenceTests: [test]
    test:
      targets:
        - CadenceTests
      gatherCoverageData: true
