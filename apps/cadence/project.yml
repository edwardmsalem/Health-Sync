name: Cadence

options:
  bundleIdPrefix: com.salemseats
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Cadence:
    type: application
    # Single multiplatform target: one codebase, two destinations.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salemseats.cadence
        PRODUCT_NAME: Cadence
        INFOPLIST_FILE: Cadence/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cadence/Resources/Cadence.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # macOS needs the sandbox on for App Store distribution; the
        # calendars entitlement is what lets EventKit through it.
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    entitlements:
      path: Cadence/Resources/Cadence.entitlements

  CadenceTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salemseats.cadence.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
        CadenceTests: [test]
    test:
      targets:
        - CadenceTests
      gatherCoverageData: true
